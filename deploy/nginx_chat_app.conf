# ==============================================================================
# Nginx Reverse Proxy Configuration for Django Channels Chat App
# Target Path on VM: /etc/nginx/sites-available/chat_app
# ==============================================================================

# 1. HTTP Server - Redirects all unencrypted traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN.duckdns.org;

    # Let's Encrypt ACME challenge location for SSL certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - SSL/TLS Termination + WebSocket & Static File Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN.duckdns.org;

    # Let's Encrypt SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.duckdns.org/privkey.pem;

    # Modern secure SSL protocols and ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Max upload size
    client_max_body_size 20M;

    # --------------------------------------------------------------------------
    # Static Files: Served directly by Nginx (ultra-fast, bypasses Daphne/Python)
    # --------------------------------------------------------------------------
    location /static/ {
        alias /home/ubuntu/chat_server/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # WebSocket Traffic: /ws/chat/ -> Daphne ASGI Server on Port 8001
    # --------------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;

        # Upgrade HTTP connection to persistent WebSocket pipe
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward real client IP and host details
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Prevent Nginx from closing idle WebSocket connections
        # (Default is 60s; 86400s keeps it alive for 24 hours)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # Standard Web/HTTP Traffic -> Daphne ASGI Server on Port 8001
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8001;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
